name: PHPUnit

on:
  push:
    branches: [ "master", "v4.0" ]
  pull_request:
    branches: [ "master", "v4.0" ]

permissions: {}

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build-only

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, bz2, posix, fileinfo, curl, mbstring, phar
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        # no lock file is committed; resolve a PHPUnit compatible with this
        # runner's PHP (PU10 on 8.1, 11 on 8.2, 12 on 8.3, 13 on 8.4/8.5)
        run: composer update --no-interaction --no-progress

      - name: Build dist artifacts
        run: php compiler.php

      - name: Run test suite
        run: ./vendor/bin/phpunit
